<tr id="{{part.row_id}}" data-type="{{part.type}}">
    <td><input type="checkbox" class="input" data-bulk value="{{part.id}}" aria-label="Select {{part.name}}"></td>
    <td>
        <div class="flex items-center gap-1">
            <button
                type="button"
                class="btn"
                data-variant="ghost"
                data-size="icon-sm"
                aria-label="Edit {{part.name}}"
                data-tooltip="Edit"
                hx-get="{% url 'part_edit' %}?id={{part.id}}"
                hx-target="#page-dialog"
            >
                <i class="fas fa-edit"></i>
            </button>
        </div>
    </td>
    <td>{{part.type_label}}</td>
    <td data-sort-value="{{part.name}}">
        {% include "partials/part_link.html" with label=part.name params=part.detail_params %}{% if part.stock %} <span class="badge" data-variant="secondary">stock</span>{% endif %}
    </td>
    <td class="text-center" data-sort-value="{{part.quantity}}">
        <input
            type="number"
            class="input w-20 text-center tabular-nums"
            name="quantity"
            value="{{part.quantity}}"
            min="1"
            step="1"
            required
            aria-label="Quantity of {{part.name}}"
            hx-post="{% url 'part_quantity' %}?id={{part.id}}"
            hx-trigger="change"
            hx-target="closest tr"
            hx-swap="outerHTML"
        >
    </td>
    <td><p class="line-clamp-2 whitespace-normal" title="{{part.info}}">{{part.info}}</p></td>
</tr>
