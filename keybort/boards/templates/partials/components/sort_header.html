<th data-sort="{{ key }}" aria-sort="none"{% if class %} class="{{ class }}"{% endif %}{% if filter_column is not None %} data-filter-column="{{ filter_column }}"{% endif %}{% if filter_column %} hidden{% endif %}>
    <button type="button" class="inline-flex items-center gap-1.5 hover:text-foreground">{{ label }}<i class="fas fa-sort text-xs text-muted-foreground"></i></button>
</th>
