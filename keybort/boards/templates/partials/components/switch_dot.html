{% comment %}colored dot for a switch category; kind is {slug, label} from helpers.parts.switch_kind. pass decorative=True when the label is already written out next to it{% endcomment %}{% if kind %}<span class="switch-dot" data-switch="{{ kind.slug }}"{% if decorative %} aria-hidden="true"{% else %} role="img" aria-label="{{ kind.label }}" title="{{ kind.label }}"{% endif %}></span>{% endif %}
