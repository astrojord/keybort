<div class="">
    <header>
      <h2 id="page-dialog-title">{{ name }}</h2>
      <p id="page-dialog-description">{% if stock %}Stock {{ type_label|lower }}{% else %}{{ type_label }}{% endif %}</p>
    </header>
    <section>
        <table class="table">
            {% for f,v in fields.items %}
                <tr>
                    <th class="w-auto">{{f}}</th>
                    <td class="text-wrap">
                        {% if v == True %}
                        <i class="fas fa-check text-green-400" aria-hidden="true"></i><span class="sr-only">Yes</span>
                        {% elif v == False %}
                        <i class="fas fa-x  text-red-400" aria-hidden="true"></i><span class="sr-only">No</span>
                        {% else %}
                        {{v}}
                        {% endif %}
                    </td>
                </tr>
            {% endfor %}
        </table>
    </section>
    <footer class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button type="button" class="btn" data-variant="outline" onclick="this.closest('dialog').close()">Close</button>
      {% if edit_url %}
      <button type="button" class="btn" hx-get="{{ edit_url }}" hx-target="#page-dialog"><i class="fas fa-edit me-1"></i>Edit</button>
      {% endif %}
    </footer>
    <button type="button" class="btn" data-variant="ghost" data-size="icon-sm" aria-label="Close dialog" onclick="this.closest('dialog').close()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
  </div>
