<div id="{{ id_prefix }}-bulk" class="mt-4 flex flex-wrap items-center gap-3 rounded-lg border bg-muted/50 px-4 py-2 text-sm" role="region" aria-label="Selected rows" hidden>
    <span class="font-medium tabular-nums" data-bulk-count aria-live="polite"></span>
    <button type="button" class="btn" data-variant="destructive" data-size="sm" data-bulk-delete><i class="fas fa-trash"></i>Delete selected</button>
    <button type="button" class="btn" data-variant="ghost" data-size="sm" data-bulk-clear>Clear selection</button>
</div>
