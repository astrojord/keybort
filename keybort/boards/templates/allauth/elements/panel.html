{% load allauth %}
<div class="card">
    <header>
        <h2>
            {% slot title %}
            {% endslot %}
        </h2>
    </header>
    <section>
        {% slot body %}
        {% endslot %}
    </section>
    {% if slots.actions %}
        <footer class="flex flex-wrap gap-2">
            {% for action in slots.actions %}{{ action }}{% endfor %}
        </footer>
    {% endif %}
</div>
