{% load allauth %}
<form class="grid gap-6" method="{{ attrs.method }}"{% if attrs.action %} action="{{ attrs.action }}"{% endif %}>
    <div class="grid gap-4">
        {% slot body %}
        {% endslot %}
    </div>
    {% if slots.actions %}
        <div class="flex flex-wrap gap-2">
            {% slot actions %}
            {% endslot %}
        </div>
    {% endif %}
</form>
