name: keybort-lab

services:
  db:
    platform: linux/amd64
    image: postgres:18-bookworm
    volumes:
      - type: volume
        source: pg_data
        target: /var/lib/postgresql
    env_file:
      - env/lab.env
    restart: always

  app:
    platform: linux/amd64
    build:
      context: ./keybort
    working_dir: /keybort
    volumes:
      - type: volume
        source: static
        target: /var/static
    expose:
      - 8000
    env_file:
      - env/lab.env
    depends_on:
      - db
    restart: always
    command: >-
      sh -c "python manage.py collectstatic --noinput
      && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  nginx:
    image: nginx:1.29-bookworm
    volumes:
      - type: bind
        source: ./nginx/keybort.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./env/certs
        target: /etc/nginx/certs
        read_only: true
      - type: volume
        source: static
        target: /var/static
        read_only: true
    ports:
      - 80:80
      - 443:443
    depends_on:
      - app
    restart: always

volumes:
  pg_data:
  static:
